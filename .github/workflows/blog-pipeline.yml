name: Blog approval and publishing
# Emails new drafts for approval from info@ecosmetix.in and publishes approved posts (from 1 PM IST).
on:
  push:
    branches: [drafts]
  schedule:
    # times are UTC; IST = UTC + 5:30  ->  12:00, 12:30, 13:00, 13:30, 15:00, 17:00, 19:00, 21:00 IST
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 9 * * *'
    - cron: '30 11 * * *'
    - cron: '30 13 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blog-pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Check out drafts
        uses: actions/checkout@v4
        with:
          ref: drafts
          path: drafts-wt
      - name: Send approvals / publish approved posts
        env:
          MAIL_USER: info@ecosmetix.in
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIN_DIR: ${{ github.workspace }}/main
          DRAFTS_DIR: ${{ github.workspace }}/drafts-wt
        run: |
          for d in main drafts-wt; do
            git -C $d config user.name 'Ecosmetix Blog'
            git -C $d config user.email 'info@ecosmetix.in'
          done
          python3 main/tools/blog_pipeline.py
      - name: Save draft status
        if: always()
        run: |
          cd drafts-wt
          git add -A drafts || true
          git commit -m 'Update draft status' || exit 0
          git push origin HEAD:drafts

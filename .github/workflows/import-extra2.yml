name: Import 404 page and downloads (retry)
on:
  push:
    paths:
      - .github/workflows/import-extra2.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          curl -sSL -A "$UA" https://www.ecosmetix.in/404.html -o 404.html
          mkdir -p downloads
          curl -sSL -A "$UA" https://www.ecosmetix.in/downloads/Ecosmetix-Mineral-Sunscreen-SPF70.pdf -o downloads/Ecosmetix-Mineral-Sunscreen-SPF70.pdf
          curl -sSL -A "$UA" https://www.ecosmetix.in/downloads/Ecosmetix-Product-Brochure-2026-27.pdf -o downloads/Ecosmetix-Product-Brochure-2026-27.pdf
          file downloads/* 404.html; for f in downloads/*.pdf; do head -c 5 "$f" | grep -q %PDF || { echo "not a pdf: $f"; rm -f "$f"; }; done
          git rm -q .github/workflows/import-extra2.yml
          git config user.name 'ecosmetix-import'
          git config user.email 'import@users.noreply.github.com'
          git add -A
          git commit -m 'Import 404 page and downloadable PDFs' || true
          git push
